# ── 构建稳定性参数（这些值是踩坑换来的，不要随意改）────────────────
#
# 1) org.gradle.java.home：把跑 Gradle 的 JDK 钉死在工程里。
#    依赖 shell 默认 java 会出现「今天能构建、明天换个 shell 就报 AGP 不兼容」。
#    下面这行由 init-project.sh 按本机实际 JDK 路径写入；换机器后重跑一次 init
#    或手工改这里。注释掉则使用系统默认 java。
# org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
#
# 2) -Xmx4g + SerialGC + parallel=false：小项目够用，且最不容易被沙盒的
#    资源回收机制杀掉。项目变大（>300 个类或开了 R8 全量）再往上加到 8g/12g；
#    一旦日志停在 minifyReleaseWithR8 后进程消失，就是内存参数问题，不是代码问题。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# release 构建不跑 lintVital：它要额外几分钟，且常因 targetSdk 偏旧直接判红，
# 把一次正常的构建变成失败。质量门应该是单元测试 + verify.sh，不是 lint。
android.lint.checkReleaseBuilds=false
